name: engine-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml requests pyarrow kiteconnect boto3
      # includes TestNoOrderCode: fails if place_order/modify_order/cancel_order appear in repo code
      - run: python -m unittest discover -s tests/engine_tests -t . -v
